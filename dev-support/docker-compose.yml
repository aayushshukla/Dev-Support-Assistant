version: "3.9"

services:
  pgvector-db:
    image: pgvector/pgvector:pg17

    container_name: pgvector-db

    restart: always

    environment:
      POSTGRES_DB: developer_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
